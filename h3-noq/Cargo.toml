[package]
name = "h3-noq"
version = "0.0.10"
rust-version = "1.88"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>"]
edition = "2021"
documentation = "https://docs.rs/h3-quinn"
repository = "https://github.com/hyperium/h3"
readme = "README.md"
description = "QUIC transport implementation based on Noq, derived from h3-quinn."
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
license = "MIT"
publish = false

[dependencies]
h3 = { version = "0.0.8", path = "../h3" }
bytes = "1"
quinn = { package = "noq", version = "1.3.0", default-features = false, features = [
    "futures-io",
] }
futures = { version = "0.3.28" }
tokio = { version = "1", features = ["io-util"], default-features = false }
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
quinn = { package = "noq", version = "1.3.0", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "time"] }
